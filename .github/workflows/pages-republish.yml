name: Republish Pages

# Redeploys the already-committed digest HTML to GitHub Pages without
# regenerating the digest. Useful after editing digest_latest.html or the
# digests/ folder directly (e.g. retrofitting the feedback buttons).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp digest_latest.html _site/index.html
          cp -r digests _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
