name: PubMed Daily Digest

on:
  schedule:
    # 09:30 UTC ≈ 5:30 AM US Eastern (EDT). In EST (winter) this is 4:30 AM.
    # GitHub may delay scheduled runs by a few minutes under load — fine for a morning digest.
    - cron: '30 9 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # commit the updated seen_pmids.json + digests back to the repo
  pages: write              # publish to GitHub Pages
  id-token: write           # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate digest
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python pubmed_digest.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_pmids.json digests digest_latest.html
          git commit -m "digest: $(date -u +%Y-%m-%d)" || echo "no changes to commit"
          git push || echo "nothing to push"

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp digest_latest.html _site/index.html
          cp -r digests _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
